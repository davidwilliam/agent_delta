acceptance_criteria:
  - A new module mathkit/validation.py defines require_nonempty(values, name="values").
  - require_nonempty raises ValueError when values is empty and returns None otherwise.
  - mean and variance in stats.py use require_nonempty instead of their inline checks.
  - The observable behavior of mean and variance is unchanged.
  - Existing baseline tests continue to pass (no regression).

scoring:
  objective_weight: 1.0
  review_weight: 0.0

notes:
  - A hidden test asserts stats.py actually references the helper (real refactor, not a copy).
