id: hard_task_001
title: Fix multi-tenant isolation in project visibility
category: security_fix
hardness_level: H3
known_llm_failure_mode: patches_controller_symptom_instead_of_policy_root_cause
repo: saas
base_commit: HEAD
language: python
framework: pytest
prompt_file: prompt.md

context_requirement:
  min_context_tokens: 8000
  preferred_context_tokens: 200000

execution:
  timeout_minutes: 25
  max_cost_usd: 4.00
  max_agent_turns: null
  network: disabled
  package_install: false

scope:
  allowed_paths:
    - src/
    - tests/
  forbidden_paths:
    - src/saasapp/storage.py
  max_files_modified: 3
  max_lines_changed: 25
  forbidden_changes:
    - Do not weaken or remove the existing archived-visibility rule.
    - Do not modify the seed data in storage.py.
    - Do not modify, skip, or weaken the existing tests.
  forbidden_patterns:
    - pattern: "@pytest\\.mark\\.skip"
      label: test_removed_or_weakened
    - pattern: "pytest\\.skip\\("
      label: test_removed_or_weakened

tests:
  baseline:
    - pytest -q tests/
  public:
    - public_tests.py
  hidden:
    - hidden_tests.py

acceptance_criteria:
  - A user can only view projects in their own tenant, via both listing and direct fetch.
  - The archived-visibility rule is preserved (archived projects visible only to admins).
  - Admins remain scoped to their own tenant (no cross-tenant access).
  - Existing baseline tests continue to pass.

scoring:
  objective_weight: 1.0
  review_weight: 0.0

notes:
  - H3 hidden-invariant + authorization. The bug is in policy.can_view (used by both
    list and get); patching only the api list handler fails the direct-fetch tests.
