id: hard_task_004
title: Make webhook invoice creation safe under concurrent delivery
category: concurrency_idempotency
hardness_level: H5
known_llm_failure_mode: check_then_act_or_unlocked_guard_under_concurrency
repo: payments
base_commit: HEAD
language: python
framework: pytest
prompt_file: prompt.md

context_requirement:
  min_context_tokens: 8000
  preferred_context_tokens: 200000

execution:
  timeout_minutes: 25
  max_cost_usd: 4.00
  max_agent_turns: null
  network: disabled
  package_install: false

scope:
  allowed_paths:
    - src/
    - tests/
  forbidden_paths:
    - src/payments/storage.py
    - src/payments/models.py
  max_files_modified: 2
  max_lines_changed: 30
  forbidden_changes:
    - Do not remove or reduce the simulated write latency in storage.
    - Do not deduplicate by amount; distinct events with the same amount are distinct.
    - Do not weaken, skip, or delete tests.
  forbidden_patterns:
    - pattern: "@pytest\\.mark\\.skip"
      label: test_removed_or_weakened

tests:
  baseline:
    - pytest -q tests/
  public:
    - public_tests.py
  hidden:
    - hidden_tests.py

acceptance_criteria:
  - Concurrent delivery of the same event creates exactly one invoice.
  - Sequential replay of the same event remains idempotent.
  - Distinct events each create their own invoice, including under concurrency.
  - The fix is in the webhook layer; storage latency and models are unchanged.

scoring:
  objective_weight: 1.0
  review_weight: 0.0

notes:
  - H5 concurrency. Check-then-act (the base) and an unlocked in-memory guard both
    race under the simulated latency; only proper synchronization passes.
