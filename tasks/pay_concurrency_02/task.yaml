id: pay_concurrency_02
title: Make the id sequence return unique ids under concurrency
category: concurrency_idempotency
hardness_level: H5
known_llm_failure_mode: unlocked_counter_returns_duplicate_ids
repo: payments
base_commit: HEAD
language: python
framework: pytest
prompt_file: prompt.md

prompts:
  minimal: prompt_minimal.md
  strong: prompt_strong.md
  workflow: prompt_workflow.md

context_requirement:
  min_context_tokens: 4000
  preferred_context_tokens: 100000

execution:
  timeout_minutes: 20
  max_cost_usd: 3.00
  network: disabled
  package_install: false

scope:
  allowed_paths:
    - src/
    - tests/
  forbidden_paths:
    - src/payments/storage.py
    - src/payments/models.py
    - src/payments/webhook.py
  max_files_modified: 1
  max_lines_changed: 20
  forbidden_changes:
    - Do not remove or reduce the simulated latency in sequence.next_id.
    - Do not weaken, skip, or delete tests.
    - Do not change other modules.
  forbidden_patterns:
    - pattern: "@pytest\\.mark\\.skip"
      label: test_removed_or_weakened

tests:
  baseline:
    - pytest -q tests/
  public:
    - public_tests.py
  hidden:
    - hidden_tests.py

acceptance_criteria:
  - Concurrent callers of next_id never receive duplicate ids; every returned id is unique.
  - Sequential next_id calls return 1, 2, 3 in order.
  - Under N concurrent callers the returned ids are exactly the set 1..N and the maximum is N.
  - After reset the sequence restarts at 1.
  - The simulated latency in sequence.next_id is preserved.

scoring_weights:
  verified_success: 0.50
  hidden_test_score: 0.25
  regression_avoidance: 0.10
  scope_control: 0.05
  cost_efficiency: 0.05
  time_efficiency: 0.05

scoring:
  objective_weight: 1.0
  review_weight: 0.0

notes:
  - H5 concurrency. The base next_id does an unlocked read-modify-write under
    simulated latency, so concurrent callers read the same starting value before
    either writes and get duplicate ids. Only proper synchronization (for example
    a threading.Lock around the read-modify-write) passes; removing the latency is
    forbidden. Hidden tests exercise higher thread counts, the exact id set 1..N,
    and the restart after reset.
