id: go_task_001
title: Fix Truncate returning one byte too few past the string length
category: small_bug_fix
difficulty: 2
repo: go_cli
base_commit: HEAD
language: go
framework: go test
prompt_file: prompt.md

context_requirement:
  min_context_tokens: 8000
  preferred_context_tokens: 200000

execution:
  timeout_minutes: 15
  max_cost_usd: 2.00
  max_agent_turns: null
  network: disabled
  package_install: false

scope:
  allowed_paths:
    - textkit.go
  forbidden_paths:
    - go.mod
    - go.sum
  max_files_modified: 2

tests:
  baseline:
    - go test ./...
  public:
    - public_test.go
  hidden:
    - hidden_test.go

acceptance_criteria:
  - Truncate returns the whole string when n is greater than or equal to len(s).
  - Truncate returns the first n bytes when 0 <= n <= len(s).
  - Truncate returns an empty string when n is negative.
  - Truncate never panics.
  - Existing baseline tests continue to pass (no regression).

scoring:
  objective_weight: 1.0
  review_weight: 0.0

notes:
  - Detects the over-length off-by-one and the negative-n edge.
