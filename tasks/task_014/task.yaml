id: task_014
title: Implement calc (integer arithmetic expression evaluator)
category: medium_feature
tier: supplementary
hardness_level: H2
known_llm_failure_mode: operator_precedence_or_paren_errors
difficulty: 5
repo: python_package
base_commit: HEAD
language: python
framework: pytest
prompt_file: prompt.md

context_requirement:
  min_context_tokens: 8000
  preferred_context_tokens: 200000

execution:
  timeout_minutes: 25
  max_cost_usd: 4.00
  max_agent_turns: null
  network: disabled
  package_install: false

scope:
  allowed_paths:
    - src/
    - tests/
  forbidden_paths:
    - pyproject.toml
  max_files_modified: 3

tests:
  baseline:
    - pytest -q tests/
  public:
    - public_tests.py
  hidden:
    - hidden_tests.py

acceptance_criteria:
  - A new module mathkit/calc.py provides calc(expr) returning an integer.
  - Supports + - * / with standard precedence, parentheses, and unary minus.
  - Division truncates toward zero (so -10 / 3 == -3, not -4).
  - Whitespace is ignored.

scoring:
  objective_weight: 1.0
  review_weight: 0.0

notes:
  - Frontier task; truncate-toward-zero division and unary minus are the discriminators.
