id: pay_state_02
title: Enforce legal billing transitions and a terminal canceled state
category: state_machine
hardness_level: H5
known_llm_failure_mode: allows_illegal_billing_transition_or_revives_canceled
repo: payments
base_commit: HEAD
language: python
framework: pytest
prompt_file: prompt.md

prompts:
  minimal: prompt_minimal.md
  strong: prompt_strong.md
  workflow: prompt_workflow.md

context_requirement:
  min_context_tokens: 4000
  preferred_context_tokens: 100000

execution:
  timeout_minutes: 20
  max_cost_usd: 3.00
  network: disabled
  package_install: false

scope:
  allowed_paths:
    - src/
    - tests/
  forbidden_paths:
    - src/payments/storage.py
    - src/payments/models.py
    - src/payments/webhook.py
  max_files_modified: 1
  max_lines_changed: 18
  forbidden_changes:
    - Do not weaken, skip, or delete tests.
    - Keep the LEGAL set semantics; do not add transitions to dodge the checks.
    - Do not change other modules.
  forbidden_patterns:
    - pattern: "@pytest\\.mark\\.skip"
      label: test_removed_or_weakened

tests:
  baseline:
    - pytest -q tests/
  public:
    - public_tests.py
  hidden:
    - hidden_tests.py

acceptance_criteria:
  - transition allows only moves present in the LEGAL set and records the new state, returning it.
  - An illegal transition raises ValueError and does not change the stored state.
  - The "canceled" state is terminal, so every transition out of it raises ValueError.
  - A new account defaults to "trialing".
  - Legal lifecycle moves (active, past_due, active, canceled) succeed in order.

scoring_weights:
  verified_success: 0.50
  hidden_test_score: 0.25
  regression_avoidance: 0.10
  scope_control: 0.05
  cost_efficiency: 0.05
  time_efficiency: 0.05

scoring:
  objective_weight: 1.0
  review_weight: 0.0

notes:
  - H5 state machine. The base transition records any new state without validating
    the move or guarding the terminal state, so it accepts illegal transitions and
    revives canceled accounts. The fix checks (current, new) against the explicit
    LEGAL set before recording and raises ValueError otherwise; "canceled" has no
    legal outgoing transition so any move from canceled raises. Hidden tests
    exercise the legal lifecycle, the terminal guard, past_due to canceled, and
    that an illegal transition leaves the stored state unchanged.
