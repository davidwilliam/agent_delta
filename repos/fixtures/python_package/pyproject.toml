[project]
name = "mathkit"
version = "0.1.0"
description = "A tiny statistics toolkit (AgentDelta fixture)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mathkit"]
package-dir = { "" = "src" }
