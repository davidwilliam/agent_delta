fixture: python_package
language: python
framework: pytest
description: A tiny utility toolkit (mathkit) - stats, sequences, text, io, textnorm, legacy, report - with a baseline passing test suite.

# Base image (pinned by digest) for the run+commit builder.
base_image: python:3.12-slim@sha256:d764629ce0ddd8c71fd371e9901efb324a95789d2315a47db7e4d27e78f1b0e9

# Path to the fixture source, relative to the repo root.
source_path: repos/fixtures/python_package

# Where the fixture is mounted inside the sandbox.
workdir: /repo

# Commands. {workdir} is the repo root inside the sandbox.
setup:
  # Install pinned deps from the lockfile, then the package itself (SPEC 5.2).
  - pip install --no-cache-dir -r requirements.lock
  - pip install --no-cache-dir -e . --no-deps
baseline_tests:
  - pytest -q tests/

# Recorded for the reproducibility manifest. The actual base commit is created
# when the image is built (git init + commit of the pristine fixture).
base_commit: HEAD
