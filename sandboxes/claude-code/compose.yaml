# Inspect docker sandbox for AgentDelta.
#
# The image is selected at runtime via AGENTDELTA_IMAGE (set by the runner so a
# single compose file serves every prebuilt fixture image). Network is left at
# the default for the v0.1 slice; hardening (network_mode: none + host-side agent
# binary injection) is a Phase 1 task tracked in docs/reproducibility.md.
services:
  default:
    image: ${AGENTDELTA_IMAGE:-agentdelta/python_package:v0.1}
    command: ["sleep", "infinity"]
    init: true
    working_dir: /repo
    cpus: 2.0
    mem_limit: 4g
    stop_grace_period: 5s
