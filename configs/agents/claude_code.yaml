agent: claude_code
inspect_swe_agent: claude_code
# Claude Code CLI version provisioned by inspect_swe, pinned to an exact version
# (SPEC 5.2). Resolved from the `stable` channel via inspect_swe.download_agent_binary
# on 2026-06-13; recorded in the reproducibility manifest as agent_cli_version.
version: "2.1.153"
network: disabled
web_search: disabled
skills: []
mcp_servers: []
permission_mode: benchmark_sandbox
fallback_detection: required

settings:
  use_aliases: false
  require_pinned_model_id: true
  require_clean_worktree: true
  archive_transcript: true
  archive_diff: true
  archive_test_output: true
  retry_refusals: false
