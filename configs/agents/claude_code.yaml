agent: claude_code
inspect_swe_agent: claude_code
# Claude Code CLI version provisioned by inspect_swe. `stable` is a pinned channel;
# for an official run set an exact version string (SPEC 5.2) once known, e.g.
# "2.1.154", and it is recorded in the reproducibility manifest.
version: stable
network: disabled
web_search: disabled
skills: []
mcp_servers: []
permission_mode: benchmark_sandbox
fallback_detection: required

settings:
  use_aliases: false
  require_pinned_model_id: true
  require_clean_worktree: true
  archive_transcript: true
  archive_diff: true
  archive_test_output: true
  retry_refusals: false
