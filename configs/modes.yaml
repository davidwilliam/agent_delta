# Evaluation modes (SPEC-ADDENDUM section 5). A mode is a normalization applied
# to the run: a prompt transform, a set of resource limits, or both. The task,
# fixture, base commit, and scoring are identical across modes; only the
# conditions change, which is what lets cross-mode comparison isolate agentic
# amplification. Declared before runs, like the scoring config.
#
# limits map to Inspect eval limits: token_limit, message_limit, time_limit
# (seconds), cost_limit (USD). Omitted limits fall back to the task's own values.
modes:
  default:
    description: Each model exactly as a normal user would run it (ADDENDUM 5.1).

  equal_budget:
    description: Comparable resource caps across all models (ADDENDUM 5.2).
    limits:
      token_limit: 400000
      message_limit: 80
      time_limit: 900
      cost_limit: 2.00

  matched_workflow:
    description: Force the same explicit workflow for every model (ADDENDUM 5.3).
    workflow: true

  minimal_spec:
    description: >
      The terse, weak-user prompt (SPEC-ADDENDUM 14, HARD-TASKS-SPEC 6.1). Uses the
      task's author-written minimal variant when present, else the default prompt.
      Paired with strong_spec to measure whether a newer model's advantage shrinks
      once requirements are made explicit.
    minimal_spec: true

  strong_spec:
    description: >
      Give every model the task's full requirements (ADDENDUM 5.4). Uses the task's
      author-written strong variant when present, else synthesizes one from the
      acceptance criteria and forbidden paths.
    strong_spec: true

  cost_matched:
    description: Same dollar budget per task for every model (ADDENDUM 5.6).
    limits:
      cost_limit: 1.00

  time_matched:
    description: Same wall-clock budget per task for every model (ADDENDUM 5.7).
    limits:
      time_limit: 600

  older_plus_scaffold:
    description: >
      Give the older (baseline) model structured support while the newer model
      runs default (ADDENDUM 5.5). Asymmetric: only the scaffolded model is
      transformed. Tests whether the cheaper older model can match the newer one
      when given the process the newer one applies by default.
    scaffold: true

# The shared workflow injected by matched_workflow mode (ADDENDUM 5.3).
workflow_steps: |
  Follow this process for this task:
  1. Inspect the relevant files before changing anything.
  2. Write a short implementation plan.
  3. Make the smallest change that satisfies the request.
  4. Run the tests.
  5. If the tests fail, debug once and fix.
  6. Run the tests again.
  7. Review your diff against the requirements.
  8. Give a final summary of what you changed.

# The scaffold given to the older model by older_plus_scaffold mode (ADDENDUM 5.5).
scaffold_steps: |
  You are being given extra structure to work as carefully as a stronger default
  agent would. Use all of it:
  1. Inspect the relevant files and write a short implementation plan first.
  2. Decide the tests that define done before changing code (test-first).
  3. Make the smallest change that satisfies the requirements.
  4. Run the tests. If any fail, debug and iterate until they pass; make at least
     two attempts before giving up.
  5. Review your diff against every acceptance criterion below.
  6. Give a final summary of what you changed and why.
